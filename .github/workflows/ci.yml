name: ci
on: [push, pull_request]
jobs:
  lint-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck run_v100_diag.sh
      - name: python syntax
        run: python3 -m py_compile v100_diag.py
      - name: engine self-test (no GPU needed)
        run: python3 v100_diag.py --selftest
